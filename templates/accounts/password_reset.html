{% extends "base_auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="h5 mb-1">Reset your password</h1>
<p class="mb-4" style="color:var(--ez-text-muted); font-size:.85rem">
  Enter your account email and we will send you a reset link.
</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "partials/form_field.html" with field=form.email %}
  <button type="submit" class="btn btn-primary w-100 mt-2"><i class="bi bi-envelope me-1"></i> Send reset link</button>
</form>
<div class="text-center mt-3"><a href="{% url 'accounts:login' %}" class="small">Back to sign in</a></div>
{% endblock %}
