{% extends "base_auth.html" %}
{% block title %}Invitation unavailable{% endblock %}
{% block content %}
<div class="text-center py-3">
  <i class="bi bi-envelope-x" style="font-size:2.4rem; color:#ef4444"></i>
  <h1 class="h5 mt-3 mb-2">Invitation unavailable</h1>
  <p style="color:var(--ez-text-muted); font-size:.87rem">
    This invitation link is invalid, expired, cancelled or already used.<br>
    Ask your administrator to send a fresh invitation.
  </p>
  <a href="{% url 'accounts:login' %}" class="btn btn-ghost mt-2">Back to sign in</a>
</div>
{% endblock %}
