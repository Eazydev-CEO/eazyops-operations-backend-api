{% extends "base_auth.html" %}
{% block title %}Password updated{% endblock %}
{% block content %}
<div class="text-center py-3">
  <i class="bi bi-check-circle" style="font-size:2.4rem; color:#22c55e"></i>
  <h1 class="h5 mt-3 mb-2">Password updated</h1>
  <p style="color:var(--ez-text-muted); font-size:.87rem">Your password has been changed. You can now sign in.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2"><i class="bi bi-box-arrow-in-right me-1"></i> Sign in</a>
</div>
{% endblock %}
