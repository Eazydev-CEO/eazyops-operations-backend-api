{% extends "base_auth.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="text-center py-3">
  <i class="bi bi-envelope-check" style="font-size:2.4rem; color:var(--ez-primary)"></i>
  <h1 class="h5 mt-3 mb-2">Check your email</h1>
  <p style="color:var(--ez-text-muted); font-size:.87rem">
    If an account exists for that address, a password reset link is on its way.
    It may take a couple of minutes to arrive.
  </p>
  <a href="{% url 'accounts:login' %}" class="btn btn-ghost mt-2">Back to sign in</a>
</div>
{% endblock %}
