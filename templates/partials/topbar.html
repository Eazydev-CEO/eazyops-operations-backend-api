{% load ui_extras %}
<header class="ez-topbar">
  <button class="btn-icon" id="sidebar-toggle" type="button" aria-label="Toggle navigation">
    <i class="bi bi-list" style="font-size:1.2rem"></i>
  </button>
  <h2 class="ez-page-title d-none d-sm-block">{{ SITE_NAME }}</h2>

  <div class="ms-auto d-flex align-items-center gap-2">
    {% if nav_can.jobs_create %}
    <a href="{% url 'operations:job_create' %}" class="btn btn-primary btn-sm d-none d-md-inline-flex align-items-center gap-1">
      <i class="bi bi-plus-lg"></i> New Job
    </a>
    {% endif %}

    <button class="btn-icon" id="theme-toggle" type="button" aria-label="Toggle dark / light mode">
      <i class="bi bi-sun"></i>
    </button>

    <div class="dropdown">
      <button class="btn-icon" id="notif-bell" type="button" data-bs-toggle="dropdown"
              data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications">
        <i class="bi bi-bell"></i>
        <span class="badge-dot" id="notif-count" style="display:none">0</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end notif-menu">
        <div class="notif-head">
          Notifications
          <a href="#" id="notif-mark-all" class="ms-auto small">Mark all read</a>
        </div>
        <div class="notif-list" id="notif-list">
          <div class="notif-empty">
            <div class="skeleton mb-2" style="height:14px;width:80%;margin:0 auto"></div>
            <div class="skeleton" style="height:14px;width:60%;margin:0 auto"></div>
          </div>
        </div>
        <div class="notif-foot">
          <a href="{% url 'notifications:list' %}" class="small">View all notifications</a>
        </div>
      </div>
    </div>

    <div class="dropdown">
      <button class="btn p-0 border-0 bg-transparent" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu">
        <span class="ez-avatar">{% if user.photo %}<img src="{{ user.photo.url }}" alt="">{% else %}{{ user|initials }}{% endif %}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li class="px-3 py-2">
          <div class="fw-semibold">{{ user.display_name }}</div>
          <div class="small" style="color:var(--ez-text-muted)">{{ user.email }}</div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>My profile</a></li>
        <li><a class="dropdown-item" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2"></i>Change password</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
