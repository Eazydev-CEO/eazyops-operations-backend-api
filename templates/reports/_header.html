<div class="page-header">
  <div>
    <h1>{{ title }}</h1>
    <div class="sub">Report · live data{% if filters.date_from or filters.date_to %} · filtered{% endif %}</div>
  </div>
  <div class="actions">
    <a href="{% url 'reports:index' %}" class="btn btn-ghost btn-sm"><i class="bi bi-grid me-1"></i> All reports</a>
    <a href="?{{ request.GET.urlencode }}{% if request.GET %}&amp;{% endif %}export=csv" class="btn btn-primary btn-sm"><i class="bi bi-download me-1"></i> Export CSV</a>
  </div>
</div>
